# The guardrail from docs/desiderata.md: nothing merges, and nothing is
# released, unless the rungs pass. Same targets as on a laptop (Makefile);
# docs/ci.md says what runs where and what Cedar has to switch on.
name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its older run; pushes never cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rung1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Host tools (shellcheck, Qt's rcc for apps/)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends shellcheck qt6-base-dev-tools
      - run: make rung1
      - if: always()
        run: f=out/logs/rung1/summary; [ ! -f $f ] || { echo '```'; cat $f; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rung1-logs
          path: out/logs/rung1/
          retention-days: 7
          if-no-files-found: ignore

  # Cheapest first: the arm64 jobs start only once rung1 is green.
  # Component proofs in arm64 containers. Native arm64: no qemu.
  # GitHub's runners run as user `runner`, not root: see docs/ci.md.
  proofs:
    needs: rung1
    runs-on: ubuntu-24.04-arm
    # Above the sum of the proofs' own limits in the Makefile (66 min), so a
    # hang fails one step and the rest still report.
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Docker and disk
        run: |
          echo "user $(id -un) ($(id -u)), groups: $(id -Gn)"
          docker version --format 'docker {{.Server.Version}} {{.Server.Os}}/{{.Server.Arch}}'
          docker info --format 'cgroup v{{.CgroupVersion}} ({{.CgroupDriver}}), security: {{join .SecurityOptions ", "}}'
          docker buildx version
          docker compose version
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: ./.github/actions/firmware
      - run: make proofs
      - if: always()
        run: f=out/logs/proofs/summary; [ ! -f $f ] || { echo '```'; cat $f; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proofs-logs
          path: out/logs/proofs/
          retention-days: 7
          if-no-files-found: ignore

  # The full-OS emulator: the Pure's own 3.27.2.2 userland plus our stack.
  rung2:
    needs: rung1
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90   # above rung2's own limit in the Makefile (75 min)
    env:
      PP_E2E_OUT: test/e2e/out
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Docker and disk
        run: |
          echo "user $(id -un) ($(id -u)), groups: $(id -Gn)"
          docker version --format 'docker {{.Server.Version}} {{.Server.Os}}/{{.Server.Arch}}'
          docker info --format 'cgroup v{{.CgroupVersion}} ({{.CgroupDriver}}), security: {{join .SecurityOptions ", "}}'
          docker buildx version
          docker compose version
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: ./.github/actions/firmware
      - name: Host tools (Qt's rcc for apps/, readelf for the ABI check)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends qt6-base-dev-tools binutils
      - run: make rung2
      # Logs always; screenshots of reMarkable's UI only when something failed.
      - if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rung2-logs
          path: |
            ${{ env.PP_E2E_OUT }}/
            !${{ env.PP_E2E_OUT }}/**/*.png
            !${{ env.PP_E2E_OUT }}/**/*.jpg
          retention-days: 7
          if-no-files-found: ignore
      - if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rung2-logs-and-screenshots
          path: ${{ env.PP_E2E_OUT }}/
          retention-days: 7
          if-no-files-found: ignore

  # Only main, only after every rung passed. Secrets live in the `release`
  # environment, so Cedar can add a required reviewer there.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rung1, proofs, rung2]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    environment: release
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache: false
      # The stock rootfs, so mods/build.sh's ABI check runs instead of skipping.
      - uses: ./.github/actions/firmware
      - run: command -v readelf > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq binutils; }
      - name: Build and sign
        env:
          SIGNING_KEY: ${{ secrets.PP_SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            (umask 077; printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/release.key.pem")
            export PP_SIGNING_KEY="$RUNNER_TEMP/release.key.pem"
          else
            echo "::notice title=Release not signed::PP_SIGNING_KEY is not set in the release environment. Built and pack-tested only; nothing is published."
          fi
          make release
      - name: Publish
        env:
          PP_FEED_URL: ${{ secrets.PP_FEED_URL }}
          PP_PUBLISH_TOKEN: ${{ secrets.PP_PUBLISH_TOKEN }}
          PP_CF_ACCESS_CLIENT_ID: ${{ secrets.PP_CF_ACCESS_CLIENT_ID }}
          PP_CF_ACCESS_CLIENT_SECRET: ${{ secrets.PP_CF_ACCESS_CLIENT_SECRET }}
        run: |
          have=() miss=()
          for v in PP_FEED_URL PP_PUBLISH_TOKEN PP_CF_ACCESS_CLIENT_ID PP_CF_ACCESS_CLIENT_SECRET; do
            if [ -n "${!v}" ]; then have+=("$v"); else miss+=("$v"); fi
          done
          if [ ! -f out/feed/release-id ]; then
            echo "::notice title=Not published::No signed release (no PP_SIGNING_KEY)."
          elif [ ${#have[@]} = 0 ]; then
            echo "::notice title=Not published::No feed secrets in the release environment (${miss[*]})."
          elif [ ${#miss[@]} != 0 ]; then
            echo "::error title=Feed secrets incomplete::Set all four or none. Missing: ${miss[*]}"
            exit 1
          else
            # Only main's tip ships: a re-run of an older run, or one that
            # finished late, must not replace newer code. make publish also
            # skips a release not newer than the live one, or built from the
            # same mods/ and apps/ as it.
            tip=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" refs/heads/main | cut -f1) || true
            if [ -z "$tip" ]; then
              echo "::error title=Cannot read main::git ls-remote gave nothing"
              exit 1
            elif [ "$tip" != "$GITHUB_SHA" ]; then
              echo "::notice title=Not published::main is at ${tip:0:7} now, not ${GITHUB_SHA:0:7}; its own run publishes."
            else
              make publish
            fi
          fi
      - if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.key.pem"
          for f in out/logs/release/summary out/feed/latest.json; do
            [ ! -f $f ] || { echo '```'; cat $f; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
