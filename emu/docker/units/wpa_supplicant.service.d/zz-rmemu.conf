# Emulator only: there is no Wi-Fi radio, so rmemu-wifi answers wpa_supplicant's
# D-Bus API instead (one open network, "pp-emu", connected while wlan0 has the
# default route). Same unit, so xochitl's own start/stop and the stock
# ExecCondition (csl.conf "wifi = off" = flight mode) still apply.
[Service]
ExecStart=
ExecStart=/opt/rmemu/rmemu-wifi wpa
