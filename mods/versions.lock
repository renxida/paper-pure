rm-xovi-extensions   https://github.com/asivery/rm-xovi-extensions  7874154dba6793cc68a15fae0fb9dd272c4ed20a  # v19-23052026 (qt-resource-rebuilder 0.3.0, xovi-setup scripts)
qmldiff              https://github.com/asivery/qmldiff             25681c3cc7addb93fdbb41ceac1f1bdce8b2625d  # submodule of rm-xovi-extensions at v19
rm-appload           https://github.com/asivery/rm-appload          5bb34a362f09f753f18bd6261558f8e2737aacdb  # v0.5.3 (2026-05-21), last before 3.28 hooks
